services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./backend/app/rules/data:/app/app/rules/data
      - ./backend/app/history/data:/app/app/history/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
