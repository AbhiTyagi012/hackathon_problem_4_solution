- id: rule-catch-all-trending
  name: No purchase history yet -> trending picks
  description: Guarantees the Recommendation rail is never empty for a shopper with
    no purchase history (purchase_tags == []). Does not depend on purchase_tags at
    all, so it fires regardless of signal — it's the deterministic safety net that
    sits alongside the AI-driven cold-start/purchase-history rails.
  enabled: true
  priority: 5
  condition:
    all: null
    any: null
    not_: null
    field: context_type
    operator: in
    value:
    - home
    - search
    - purchase
    - evaluate
    - bulk
  recommend:
    products: []
    categories: []
    tags:
    - gaming
    - electronics
    score: 1.0
  version: 1
  updated_at: '2026-07-24T11:26:52.226028Z'
